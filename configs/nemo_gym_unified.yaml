# NeMo Gym Unified RLVR Configuration for Slime
# This configuration enables multi-environment training with NeMo Gym

nemo_gym:
  enabled: true
  
  # Head server connection (NeMo Gym orchestrator)
  head_server_host: "localhost"
  head_server_port: 11000
  
  # Auto-start NeMo Gym servers (like ng_run)
  auto_start_servers: true
  
  # Config paths for ng_run (relative to 3rdparty/nemo-gym)
  config_paths:
    - "resources_servers/math_with_judge/configs/bytedtsinghua_dapo17k.yaml"
  
  max_concurrent_rollouts: 64
  
  # Environments for Unified RLVR
  # Each environment specifies resource server and agent names
  environments:
    - name: "math_with_judge"  # Resource server name
      agent_name: "math_with_judge_simple_agent"  # Agent server name
      config: "resources_servers/math_with_judge/configs/bytedtsinghua_dapo17k.yaml"
      weight: 0.4
      
    - name: "coding"
      agent_name: "coding_simple_agent"
      config: "resources_servers/coding/configs/coding.yaml"
      weight: 0.3
      
    - name: "instruction_following"
      agent_name: "if_eval_simple_agent"
      config: "resources_servers/if_eval/configs/if_eval.yaml"
      weight: 0.3
  
  # On-policy correction settings
  on_policy_correction:
    enabled: true
    fix_re_tokenization: true
    fix_re_chat_templating: true
  
  # Routing Replay settings (for MoE models)
  routing_replay:
    enabled: true
    backend: "sglang"

# Generation backend configuration
generation:
  backend: "sglang"
